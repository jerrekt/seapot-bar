<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bar Guide · Seapot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--black:#0a0a0a;--card:#151515;--border:#262626;--gold:#c9a84c;--gold-l:#e8c96a;--white:#f0ede8;--muted:#808080;--amber:#fbd38d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.4;max-width:780px;margin:0 auto;padding-bottom:24px}

/* HERO (matches menu.adsuaracloud.com) */
.hero{padding:12px 16px 8px;text-align:center;border-bottom:1px solid var(--border)}
.hero h1{font-family:'Cinzel',serif;font-size:34px;font-weight:900;letter-spacing:.06em;color:var(--gold);line-height:1}
.hero-sub{color:var(--muted);font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin-top:3px}
.hero-sub a{color:var(--gold);text-decoration:none}

/* STICKY SEARCH + CHIPS */
.bar{position:sticky;top:0;z-index:10;background:rgba(10,10,10,.97);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;flex-direction:column;gap:7px}
input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--white);font:inherit;font-size:16px;padding:7px 11px;outline:none}
input:focus{border-color:var(--gold)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:none;color:var(--muted);font:600 11px/1 inherit;letter-spacing:.08em;text-transform:uppercase;padding:6px 11px;border:1px solid var(--border);border-radius:999px;cursor:pointer}
.chips button.on{color:#000;background:var(--gold);border-color:var(--gold)}

/* SECTIONS */
main{padding:0 12px}
.divider{display:flex;align-items:center;gap:10px;padding:12px 0 6px;color:var(--gold);font-family:'Cinzel',serif;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5}
.age{text-align:center;font-size:11px;color:var(--amber);margin:-2px 0 6px}
.list{display:grid;gap:5px;grid-template-columns:minmax(0,1fr);align-items:start}
@media(min-width:640px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* RECIPE CARD — collapsed = one line, tap to open */
.rc{min-width:0;background:var(--card);border:1px solid var(--border);border-radius:8px}
.rc[open]{border-color:var(--gold);box-shadow:0 0 10px rgba(201,168,76,.18)}
summary{list-style:none;cursor:pointer;padding:7px 10px}
summary::-webkit-details-marker{display:none}
.t{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.t .pr{margin-left:auto;color:var(--gold);font-size:12px;font-weight:600}
.t .pr+.chev{margin-left:6px}
.t .chev{margin-left:auto;color:var(--muted);font-size:9px;transition:transform .15s}
.rc[open] .chev{transform:rotate(90deg);color:var(--gold)}
.s{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rc[open] .s{display:none}
.chk{font-size:8px;font-weight:800;letter-spacing:.04em;color:var(--amber);border:1px dashed var(--amber);border-radius:3px;padding:0 4px;line-height:14px}
.body{padding:0 10px 9px}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.meta span{font-size:10.5px;background:rgba(201,168,76,.12);color:var(--gold-l);border:1px solid rgba(201,168,76,.35);border-radius:4px;padding:1px 6px}
.note{font-size:11px;color:var(--amber);margin-bottom:5px}
h3{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:5px 0 2px;padding-top:5px;border-top:1px solid var(--border)}
ul{list-style:none}
ul li{display:flex;gap:8px;font-size:12.5px;padding:1px 0;border-bottom:1px solid #1c1c1c}
ul b{flex:none;width:54px;color:var(--gold);font-weight:600}
ul i{color:var(--muted);font-size:11px;font-style:normal}
ol{padding-left:17px;font-size:12.5px}
ol li{margin:1px 0}
ol li::marker{color:var(--gold);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.foot{text-align:center;margin-top:12px;color:var(--muted);font-size:11px}
.sig{text-align:right;padding:4px 12px 0;color:#555;font-size:9px;letter-spacing:.04em}
.meta button.gl{font:inherit;font-size:10.5px;cursor:pointer;background:rgba(201,168,76,.12);color:var(--gold-l);border:1px solid rgba(201,168,76,.35);border-radius:4px;padding:1px 6px}
.meta button.gl::after{content:" ⓘ";color:var(--gold);opacity:.8}
.gi{display:inline-block;vertical-align:-4px;margin-right:4px}
.meta .gi{background:none;border:0;padding:0;border-radius:0}
.gi svg{width:13px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:9;stroke-linejoin:round;stroke-linecap:round}
.gi svg .liq{fill:currentColor;stroke:none;opacity:.25}
.gi svg .ice{display:none}
.s .gi{color:var(--gold);opacity:.85}
.gm{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:16px}
.gm.on{display:flex}
.gm-box{background:var(--card);border:1px solid var(--gold);border-radius:12px;box-shadow:0 0 22px rgba(201,168,76,.3);width:min(300px,100%);padding:16px;text-align:center}
.gm-box svg,.gm-box img{width:100%;max-height:240px;display:block;margin:0 auto 10px;border-radius:8px}
.gm-box svg{fill:none;stroke:var(--gold-l);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.gm-box svg .liq{fill:rgba(201,168,76,.18);stroke:none}
.gm-box svg .ice{stroke:var(--gold);stroke-width:1.4;opacity:.7}
.gm-t{font-family:'Cinzel',serif;color:var(--gold);font-size:16px;font-weight:700;letter-spacing:.08em}
.gm-d{color:var(--muted);font-size:12px;margin-top:3px}
.gm-x{margin-top:12px;font:600 11px/1 inherit;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:none;border:1px solid var(--border);border-radius:999px;padding:7px 16px;cursor:pointer}
</style>
</head>
<body>

<div class="hero">
  <h1>SEAPOT</h1>
  <div class="hero-sub">Bar Guide · Staff Only · <a href="https://menu.adsuaracloud.com">Menu ↗</a></div>
</div>

<div class="bar">
  <input id="q" type="search" placeholder="Search drink or ingredient…" autocomplete="off">
  <div class="chips" id="chips"></div>
</div>

<main id="main"></main>
<div class="gm" id="gm"><div class="gm-box" role="dialog" aria-modal="true"><div id="gm-pic"></div><div class="gm-t" id="gm-t"></div><div class="gm-d" id="gm-d"></div><button class="gm-x" id="gm-x">Close</button></div></div>
<div class="foot">Not sure? lol gl</div>
<div class="sig">hi from jerrekt</div>

<script>
// ing: [amount, ingredient, note]   chk:1 = proportions not confirmed yet   price: must match menu.adsuaracloud.com

 {cat:"Cocktails",name:"Long Island",price:"$14",glass:"Highball",garnish:"—",

  steps:["Fill glass with ice.","Add Long Island mix and lime juice.","Fill with soda water.","Top off with cola."]},
 {cat:"Cocktails",name:"Moscow Mule",price:"$14",glass:"Mug / highball",garnish:"Lime slice",
  ing:[["2 oz","Vodka"],["","Ginger beer","fill the glass"]],

 {cat:"Cocktails",name:"Lady Vodka",price:"$19",note:"Menu lists it as 30 oz",glass:"30 oz glass",garnish:"—",

  steps:["Add vodka and apple juice.","Passion fruit syrup, an appropriate amount to taste.","Fill up with soda water and Sprite."]},
 {cat:"Cocktails",name:"Green Tea Cocktail",price:"$14",note:"No tea in it — not the hot green tea",glass:"Rocks",garnish:"Lemon wedge",
  ing:[["1 oz","Irish whiskey","Jameson"],["1 oz","Peach schnapps"],["1 oz","Sour mix"],["splash","Sprite"],["","Ice"]],
  steps:["Shake whiskey, peach schnapps and sour mix with ice.","Pour into a rocks glass with ice.","Top with a splash of Sprite.","Lemon wedge."]},
 {cat:"Cocktails",name:"Mimosa",price:"$11",chk:1,glass:"Flute",garnish:"—",
  ing:[["3 oz","Champagne"],["3 oz","Orange juice"]],
  steps:["Champagne first, tilted.","Top with OJ. No stir."]},

 // ── Soju ──
 {cat:"Soju",name:"Soju Cocktail",price:"$16",note:"Mix 1–2 flavors: Peach · Kiwi · Passion Fruit · Lychee · Mango · Watermelon · Yogurt · Strawberry · Guava",glass:"30 oz pitcher",garnish:"—",
  ing:[["4 fingers","Soju","poured 4 fingers tall"],["","Flavor syrup","1–2 flavors"],["","Sprite","fill the rest"]],
  steps:["Pour soju 4 fingers tall.","Add the flavor syrup(s).","Fill the rest with Sprite.","Serve with soju glasses."]},
 {cat:"Soju",name:"Soju Cocktail Tower",price:"$52",glass:"Tower",garnish:"—",
  ing:[["1 pitcher","Soju cocktail","30 oz, made as above"]],
  steps:["Make a full 30 oz soju cocktail pitcher (soju 4 fingers tall, syrup, rest Sprite).","Pour the whole pitcher into the tower.","Serve with soju glasses."]},
 {cat:"Soju",name:"Soju Bottle",price:"$13",note:"Original · Zero Sugar · Peach · Yogurt · Apple · Strawberry · Apple Mango · Green Grape",glass:"Soju glasses",garnish:"—",
  ing:[["12 oz","Soju","chilled"]],
  steps:["Serve cold with a glass per drinker.","Check ID for everyone drinking."]},
 {cat:"Soju",name:"Sake / Yuzu Bomb",price:"$6.99",note:"Book also has a Soju Bomb (house soju); not on the menu",glass:"Beer glass + shot",garnish:"—",
  ing:[["75%","Draft beer","fill glass about 3/4"],["1 shot","House sake","Yuzu Bomb: house soju or sake"],["80% of cap","Yuzu vinegar","Yuzu Bomb only"]],
  steps:["Fill the glass about 3/4 with draft beer.","Sake Bomb: add 1 shot of house sake.","Yuzu Bomb: add 1 shot of house soju or sake plus yuzu vinegar, 80% of a cap."]},

 // ── Mocktails ── (per Seapot recipe book, $8)

  steps:["Half cup of ice, raspberry premix.","Fill half Sprite + half soda water.","Squeeze a lemon wedge in; add fresh lemon peel."]},

  ing:[["half cup","Ice"],["2 oz","Strawberry premix"],["","Sprite + soda water","fill half & half"]],
  steps:["Half cup of ice, strawberry premix.","Fill half Sprite + half soda water"]},
 {cat:"Mocktails",name:"Ube Colada",price:"$8",note:"Book lists the ube premix after the fill; confirm order",glass:"Hurricane",garnish:"—",
  ing:[["half cup","Ice"],["1.5 oz","Piña colada mix"],["0.75 oz","Pineapple juice"],["1 oz","Ube premix"],["","Sprite + soda water","fill half & half"],["1 oz","Soda water + 1 drop ube extract","pour on top"]],
  steps:["Half cup of ice, piña colada mix, pineapple juice, ube premix.","Fill half Sprite + half soda water","Mix 1 oz soda water with 1 drop ube extract and pour on top."]},
 {cat:"Mocktails",name:"Sweet Heart",price:"$8",glass:"Hurricane",garnish:"—",
  ing:[["half cup","Ice"],["2 oz","Peach premix"],["","Sprite + soda water","fill half & half"]],

 {cat:"Mocktails",name:"Mai Tai (Virgin)",price:"$8",glass:"Highball",garnish:"—",

 {cat:"Mocktails",name:"Sunrise (Virgin)",price:"$8",glass:"Highball",garnish:"—",

 // ── Non-Alc ──
 {cat:"Non-Alc",name:"Fresh Lemonade",price:"$5.99",note:"Peach · Mango · Yogurt · Lychee · Passion Fruit · Kiwi · Watermelon · Guava · Strawberry",chk:1,glass:"Beer cup",garnish:"Lemon wheel",
  ing:[["1.5 oz","Fresh lemon juice"],["1 oz","Flavor syrup"],["4 oz","Water"],["","Ice"]],
  steps:["Shake lemon juice, flavor syrup and water with ice.","Pour into glass.","Lemon wheel."]},
 {cat:"Non-Alc",name:"Shirley Temple",price:"$3.99",glass:"Soda cup",garnish:"Cherry",
  ing:[["6 oz","Sprite"],["0.5 oz","Grenadine"],["","Ice"]],
  steps:["Ice, Sprite.","Grenadine, stir lightly.","Cherry."]}
];

const cats=["All",...new Set(D.map(d=>d.cat))];
let cur="All";
const chips=document.getElementById('chips'),main=document.getElementById('main'),q=document.getElementById('q');
chips.innerHTML=cats.map(c=>`<button data-c="${c}"${c===cur?' class="on"':''}>${c}</button>`).join('');
chips.onclick=e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.c;[...chips.children].forEach(x=>x.classList.toggle('on',x===b));render()};
q.oninput=render;

function card(d,open){
  const line=d.ing.filter(i=>!/^ice/i.test(i[1])).map(i=>i[1]).join(' · ');
  return `<details class="rc"${open?' open':''}><summary>
    <div class="t">${d.name}${d.chk?'<span class="chk">CONFIRM</span>':''}${d.price?`<span class="pr">${d.price}</span>`:''}<span class="chev">▶</span></div>
    <div class="s">${gi(d.glass)}${d.glass} — ${line}</div></summary>
    <div class="body">${d.note?`<div class="note">${d.note}</div>`:''}
    <div class="meta"><button class="gl" data-g="${d.glass}">${gi(d.glass)}${d.glass}</button><span>🍋 ${d.garnish}</span></div>
    <ul>${d.ing.map(([a,n,t])=>`<li><b>${a}</b><span>${n}${t?` <i>· ${t}</i>`:''}</span></li>`).join('')}</ul>
    <h3>Steps</h3><ol>${d.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div></details>`;
}
function render(){
  const s=q.value.trim().toLowerCase();
  const r=D.filter(d=>(cur==="All"||d.cat===cur)&&(!s||(d.name+' '+(d.note||'')+' '+d.ing.map(i=>i[1]).join(' ')).toLowerCase().includes(s)));
  if(!r.length){main.innerHTML='<div class="empty">No drinks match.</div>';return}
  const open=r.length===1;
  main.innerHTML=[...new Set(r.map(d=>d.cat))].map(c=>
    `<div class="divider">${c}</div>${c==="Cocktails"||c==="Soju"?'<div class="age">🔞 Check ID — 21+</div>':''}<div class="list">${r.filter(d=>d.cat===c).map(d=>card(d,open)).join('')}</div>`).join('');
}
// ── Glassware pop-up. To use a real photo instead of a drawing, put it in site/img/ and set photo:"img/<file>.jpg"
const ICE='<rect class="ice" x="38" y="70" width="14" height="14" rx="2"/><rect class="ice" x="49" y="80" width="13" height="13" rx="2"/>';
const GW={
 highball:{name:"Highball",desc:"Tall straight glass · ~10–12 oz · most mixed drinks",
  svg:`<svg viewBox="0 0 100 140"><path class="liq" d="M33 40 L35 122 Q35 126 39 126 L61 126 Q65 126 65 122 L67 40Z"/>${ICE}<path d="M30 14 L34 124 Q34 130 40 130 L60 130 Q66 130 66 124 L70 14"/><path d="M34 118 L66 118"/></svg>`},
 hurricane:{name:"Hurricane",desc:"Tall curved glass on a stem · ~15 oz · Sweet Heart, Ube Colada",
  svg:`<svg viewBox="0 0 100 140"><path class="liq" d="M36 50 Q34 66 40 76 Q45 86 50 86 Q55 86 60 76 Q66 66 64 50Z"/><path d="M36 14 Q27 44 36 70 Q42 86 50 88 Q58 86 64 70 Q73 44 64 14"/><circle cx="50" cy="100" r="6"/><path d="M50 88 L50 94 M50 106 L50 120"/><path d="M36 128 Q50 122 64 128"/></svg>`},
 rocks:{name:"Rocks",desc:"Short, wide, heavy base · ~8–10 oz · Old Fashioned, Mai Tai",
  svg:`<svg viewBox="0 0 100 140"><path class="liq" d="M25 72 L27 112 L73 112 L75 72Z"/><rect class="ice" x="36" y="76" width="18" height="17" rx="2"/><rect class="ice" x="52" y="88" width="16" height="15" rx="2"/><path d="M22 52 L26 116 Q26 122 32 122 L68 122 Q74 122 74 116 L78 52"/><path d="M26 112 L74 112"/></svg>`},
 mug:{name:"Mug",desc:"Copper mule mug if stocked, otherwise a highball",
  svg:`<svg viewBox="0 0 100 140"><path class="liq" d="M26 50 L28 114 L66 114 L68 50Z"/>${ICE}<path d="M24 34 L27 118 Q27 124 33 124 L61 124 Q67 124 67 118 L70 34"/><path d="M68 52 Q86 52 86 72 Q86 92 67 94"/><path d="M68 60 Q78 60 78 72 Q78 84 67 86"/></svg>`},
 flute:{name:"Champagne Flute",desc:"Tall narrow bowl on a stem · ~6 oz · Mimosa",
  svg:`<svg viewBox="0 0 100 140"><path class="liq" d="M39 40 L41 74 Q43 84 50 84 Q57 84 59 74 L61 40Z"/><path d="M37 14 L40 74 Q42 88 50 88 Q58 88 60 74 L63 14"/><path d="M50 88 L50 124"/><path d="M36 128 Q50 122 64 128"/></svg>`},
 pitcher:{name:"Pitcher",desc:"30 oz · soju cocktails",
  svg:`<svg viewBox="0 0 100 140"><path class="liq" d="M28 54 L30 120 L68 120 L70 54Z"/>${ICE}<path d="M24 30 L18 22 L36 26 L72 26 L72 30 L69 122 Q69 128 63 128 L35 128 Q29 128 29 122Z"/><path d="M72 40 Q90 40 90 64 Q90 88 70 92"/><path d="M71 50 Q82 50 82 64 Q82 80 70 82"/></svg>`},
 tower:{name:"Tower",desc:"Tall tap tower with ice core · soju cocktail tower",
  svg:`<svg viewBox="0 0 100 140"><path class="liq" d="M36 34 L36 112 L64 112 L64 34Z"/><path d="M47 30 L47 112 M53 30 L53 112" class="ice"/><rect x="34" y="14" width="32" height="104" rx="5"/><path d="M40 10 L60 10 L60 14 L40 14Z"/><path d="M66 102 L76 102 L76 110"/><path d="M22 118 L78 118 L82 128 L18 128Z"/></svg>`},
 soju:{name:"Soju Glasses",desc:"Small shot glasses · one per drinker",
  svg:`<svg viewBox="0 0 100 140"><path class="liq" d="M20 82 L22 112 L42 112 L44 82Z"/><path d="M17 66 L21 118 Q21 122 25 122 L39 122 Q43 122 43 118 L47 66"/><path class="liq" d="M56 82 L58 112 L78 112 L80 82Z"/><path d="M53 66 L57 118 Q57 122 61 122 L75 122 Q79 122 79 118 L83 66"/></svg>`},
 pint:{name:"Beer Cup",desc:"Pint-style beer cup · fresh lemonade",
  svg:`<svg viewBox="0 0 100 140"><path class="liq" d="M30 56 L33 124 L67 124 L70 56Z"/>${ICE}<path d="M27 30 L32 126 Q32 132 38 132 L62 132 Q68 132 68 126 L73 30"/></svg>`},
 cup:{name:"Soda Cup",desc:"Regular soda cup · Shirley Temple",
  svg:`<svg viewBox="0 0 100 140"><path class="liq" d="M30 50 L34 124 L66 124 L70 50Z"/>${ICE}<path d="M26 22 L32 126 Q32 132 38 132 L62 132 Q68 132 68 126 L74 22"/><path d="M23 22 H77"/></svg>`},
 bomb:{name:"Beer Glass + Shot",desc:"Beer in a pint, sake shot balanced on chopsticks",
  svg:`<svg viewBox="0 0 100 140"><path class="liq" d="M30 56 L33 124 L67 124 L70 56Z"/><path d="M27 40 L32 126 Q32 132 38 132 L62 132 Q68 132 68 126 L73 40"/><path d="M14 34 L86 30 M14 40 L86 36"/><path d="M42 12 L44 32 L56 32 L58 12"/><path class="liq" d="M43 20 L44 30 L56 30 L57 20Z"/></svg>`}
};
const gi=g=>`<span class="gi">${GW[glassKey(g)].svg}</span>`;
function glassKey(g){g=g.toLowerCase();
  return g.includes('beer cup')?'pint':g.includes('soda cup')?'cup':g.includes('pitcher')?'pitcher':g.includes('tower')?'tower':g.includes('soju')?'soju':g.includes('beer')?'bomb':
         g.includes('hurricane')?'hurricane':g.includes('mug')?'mug':g.includes('flute')?'flute':g.includes('rocks')?'rocks':'highball';}
const gm=document.getElementById('gm');
function openGlass(label){
  const k=GW[glassKey(label)];
  document.getElementById('gm-pic').innerHTML=k.photo?`<img src="${k.photo}" alt="${k.name}">`:k.svg;
  document.getElementById('gm-t').textContent=label;
  document.getElementById('gm-d').textContent=k.desc;
  gm.classList.add('on');
}
